<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- VIEWPORT -- user-scalable=no prevents pinch-zoom which breaks the
     scroll-snap card feel. viewport-fit=cover extends into the iPhone's
     notch/Dynamic Island area and S20's punch-hole camera area. -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">

<!-- ── 120Hz UNLOCK TECHNIQUES FOR SAMSUNG/ANDROID ────────────────────
     Samsung One UI caps web content at 60Hz by default even on 120Hz
     displays. Multiple techniques combined give the best chance of
     unlocking the full refresh rate.

     What each does:
     1. HandheldFriendly      -- signals mobile-optimised content
     2. CSS animation trick   -- some Samsung firmware ONLY grants 120Hz
                                 when a CSS animation is running on page.
                                 A 1px invisible element runs opacity:1→1
                                 continuously (zero visual impact).
     3. will-change: transform on animated elements (see shorts_feed.css)
                             -- promotes elements to GPU compositor layers,
                                signals animation intent to the browser
     4. Continuous rAF loop  -- already present (sweep animation). Chrome
                                detects animation-heavy pages and may grant
                                higher refresh automatically.

     HONEST NOTE: Samsung's adaptive refresh rate policy is enforced at
     the firmware level. These are hints, not guarantees. If the OS is
     in power saving mode or adaptive battery is on, 60Hz wins regardless.
     Settings → Device care → Battery → Adaptive power saving → OFF
     is the most reliable way to unlock 120Hz for testing.
────────────────────────────────────────────────────────────────────── -->
<meta name="HandheldFriendly" content="true">

<!-- PWA / ADD TO HOME SCREEN
     These tags make the app look and behave like a native app when added
     to the home screen on both iOS Safari and Android Chrome. -->

<!-- iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black-translucent" extends behind the status bar into the notch area
     on iPhone 13 mini. Use "black" if you want the status bar opaque. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECG Shorts">

<!-- Android Chrome (PWA manifest) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<!-- theme-color sets the browser chrome colour on Android --
     #000000 matches the app's true black background so the
     browser bar disappears visually when scrolling. -->

<!-- Prevents iOS from auto-detecting phone numbers and turning them
     into links -- not relevant for ECG data but prevents Safari from
     randomly styling numeric values in the signal annotations. -->
<meta name="format-detection" content="telephone=no">

<!-- PWA manifest -- tells Chrome on Android this is installable.
     Create /static/manifest.json (see below) for full install support. -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

<!-- iOS home screen icons -- Safari uses these when the user adds to
     home screen. Sizes cover iPhone 13 mini (375pt) and larger devices.
     Replace with your actual icon files when you have them. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">
<link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='icons/apple-touch-icon-152.png') }}">

<title>Journey Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='shorts/shorts_feed.css') }}">
<style>
    body { margin: 0; background: var(--bg, #000000); color: #fff; font-family: sans-serif; }

    /* ── 120Hz CSS ANIMATION TRICK ─────────────────────────────────────
       A hidden 1×1px element running a continuous CSS animation.
       Some Samsung One UI firmware versions only enable 120Hz when
       the browser detects an active CSS animation on the page.
       opacity: 0.9999 → 1.0000 is visually identical but technically
       an animation -- the browser can't optimise it away. Zero GPU cost
       since it's a single pixel outside the visible area. */
    @keyframes _hz_unlock { from { opacity: 0.9999; } to { opacity: 1; } }
    #_hz_unlock_el {
        position: fixed; width: 1px; height: 1px;
        top: -2px; left: -2px; pointer-events: none;
        animation: _hz_unlock 1ms linear infinite;
        will-change: opacity;
    }

    /* ── GPU LAYER PROMOTION ────────────────────────────────────────────
       will-change: transform tells the browser these elements will
       animate, promoting them to compositor layers. This is what signals
       "this is an animation-heavy page" to Samsung's display scheduler.
       Combined with the rAF loop already running, this gives the strongest
       possible hint that 120Hz is warranted. */
    .journey-feed, .journey-card, .chart {
        will-change: transform;
        transform: translateZ(0); /* force GPU layer even before animation starts */
    }

    /* Safe area insets -- required when viewport-fit=cover is set.
       Without these, content clips behind:
         iOS: the Dynamic Island/notch (top) and home indicator bar (bottom)
         Android: the punch-hole camera (top) and navigation gestures (bottom)
       env(safe-area-inset-*) resolves to 0 on desktop browsers so this
       has no effect outside a real device. */
    .journey-feed {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
    }

    /* Stage rail sits above the home indicator on iPhone --
       add bottom safe area so buttons aren't clipped. */
    .stage-rail {
        margin-bottom: env(safe-area-inset-bottom);
    }
    .journey-feed {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* older Edge/IE */
    }
    /* Chrome/Safari/newer Edge -- scroll/swipe still works fully, only the
       visible track+thumb are hidden. Matches how real Shorts/Reels-style
       apps feel: no visible scrollbar breaking the edge-to-edge, immersive
       card experience. */
    .journey-feed::-webkit-scrollbar {
        display: none;
    }
    .journey-card {
        height: 100vh;
        scroll-snap-align: start;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto; /* safety net for unusually dense content -- scrollbar itself hidden below, same reasoning as .journey-feed */
        position: relative; /* anchors .stage-rail's position:absolute against the CARD, not the viewport */
        display: flex;
        flex-direction: column;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .journey-card::-webkit-scrollbar {
        display: none;
    }
    /* Three stacking zones -- journey_scroll_feed.js places each of
       title/caption/description/chart into ONE of these, based on the
       recipe's layout config. Multiple elements sharing a zone stack
       naturally (flex column), never overlap. */
    .layout-zone {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
    }
    .layout-zone[data-zone="center"] {
        flex: 1 1 auto;
        justify-content: center;
        min-height: 0;
        /* leave room at bottom for the fixed text overlay */
        padding-bottom: 130px;
    }
    /* Bottom zone -- fixed position anchored to card's bottom edge.
       Height is fixed (130px) so it never shifts between stages
       regardless of text length. Content that overflows clips cleanly.
       This matches real Shorts/Reels behavior: the text overlay is a
       fixed-height region, not a flexbox item that reflows. */
    .layout-zone[data-zone="bottom"] {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 80px; /* leave space for rail buttons on the right */
        max-height: 140px; /* cap total height -- adapts to content */
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 4px;
    }

    /* Title -- always fully visible, never clipped */
    .journey-card .stage-title {
        flex-shrink: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* Caption -- always visible, max 2 lines */
    .journey-card .stage-caption {
        flex-shrink: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* Description -- collapsed to 2 lines by default, expandable on tap.
       A fade gradient signals there's more text without hard-clipping. */
    .journey-card .stage-description {
        flex-shrink: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        transition: max-height 0.3s ease;
    }
    .journey-card .stage-description.expanded {
        display: block;
        -webkit-line-clamp: unset;
        overflow: visible;
    }
    /* Fade gradient on collapsed description */
    .journey-card .stage-description::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 1.2em;
        background: linear-gradient(transparent, var(--bg, #000));
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.2s;
    }
    .journey-card .stage-description.expanded::after {
        opacity: 0;
    }
    .journey-card .chart {
        width: 100%;
        flex: 1; /* shrinks to fit whatever space remains when sharing a zone with title/description -- was a rigid height:400px, which could push total content past 100vh once multiple elements shared one zone, triggering the card's overflow-y:auto scrollbar */
        min-height: 200px; /* floor, so it never becomes too small to actually read */
        background: transparent; /* was #16161A, a visibly different shade from the card -- made the plot look like a separate boxed element rather than fused into the card. Plotly's own paper_bgcolor/plot_bgcolor are already transparent too, so this now shows the card's true-black background straight through */
        margin: 16px 0; /* spacing from title/caption -- kept, this is layout breathing room, unrelated to the "boxed look" fix above */
        position: relative;
        overflow: hidden; /* NO inner scrollbars -- was overflow-y:auto, which could show a scrollbar within the chart itself. Plotly has its own built-in pan/scroll-zoom feature for later, but that's a deliberate opt-in, not an accidental container scrollbar */
    }
    /* Subtle glow on the actual signal trace -- targets Plotly's own SVG
       structure for line traces (.scatterlayer > .lines > path), so only
       the line itself glows, not axis labels or gridlines. Color matches
       the line's real rendered color (#e8f4f8, THEMES[0].traceColor in
       rail_controls.js) -- not a guess, confirmed against what's actually
       drawn. Modest blur radius for a subtle glow, not full neon. */
    .journey-card .chart .scatterlayer .lines path {
        filter: drop-shadow(0 0 3px var(--ecg-glow-color, rgba(232, 244, 248, 0.7)));
    }
    /* Poincaré scatter point glow -- targets marker elements specifically.
       Uses a fixed cyan glow matching the point color (#00E5FF) rather
       than the theme's trace color, since the Poincaré dots are always
       cyan regardless of theme. Slightly wider blur than the line glow
       since dots are discrete and benefit from more spread. */
    .journey-card .chart .scatterlayer .points path {
        filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.6));
    }
    /* shorts_feed.css's .stage-caption is position:absolute, designed for
       the OLDER system's different layout -- overridden here (higher
       specificity via .journey-card, naturally wins) so it participates
       normally in this flex-based zone layout instead of ignoring it. */
    .journey-card .stage-title,
    .journey-card .stage-caption,
    .journey-card .stage-description {
        position: static;
        margin: 0;
        opacity: 1; /* shorts_feed.css's .stage-caption defaults to opacity:0, only revealed via a .visible class that the CURRENT system never adds (that was the OLD system's fade-in, driven by now-deleted JS) -- left as-is, caption was permanently invisible regardless of any layout/positioning fix */
        text-align: left; /* was center -- switched specifically for this YT-Shorts-style bottom overlay, since Shorts' own text block is left-aligned, not centered. Flagging this as a deliberate change from the earlier explicit "center" request. */
        font-family: 'Roboto', sans-serif;
    }
    .journey-card .stage-title { font-weight: 700; } /* bold -- matches YT's own channel-name weight */
    .journey-card .stage-caption,
    .journey-card .stage-description { font-weight: 400; } /* regular -- matches the lighter description text below a Short's channel name */
    /* clamp(min, preferred, max) -- preferred is viewport-width-based (vw),
       so text genuinely scales with screen size rather than staying one
       fixed rem value on every device. Floor/ceiling keep it from ever
       becoming unreadably small or comically large at the extremes. */
    .journey-card .stage-title { font-size: clamp(1.1rem, 4vw, 1.6rem); }
    .journey-card .stage-caption { color: #ccc; font-size: clamp(0.85rem, 3vw, 1.1rem); }
    .journey-card .stage-description { color: #aaa; font-size: clamp(0.95rem, 3.2vw, 1.2rem); }
    /* Rail's vertical anchor, configurable via layout.railControls --
       still always right-aligned (position:absolute; right), only the
       vertical anchor point changes. "bottom" matches the ORIGINAL
       hardcoded behavior exactly -- the default if layout is omitted. */
    .stage-rail[data-zone="top"] { top: 60px; bottom: auto; }
    .stage-rail[data-zone="center"] { top: 50%; bottom: auto; transform: translateY(-50%); }
    .stage-rail[data-zone="bottom"] { bottom: 100px; top: auto; }
</style>
</head>
<body>
    <!-- Hidden 120Hz unlock element -- see CSS above -->
    <div id="_hz_unlock_el" aria-hidden="true"></div>
    <main id="feed" class="journey-feed"></main>

    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script src="{{ url_for('static', filename='shorts/core/rail_controls.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/core/shared_signal_utils.js') }}"></script>

    <!-- dsp_registry.js and rendering_registry.js must load BEFORE the
         algorithm/renderer files below, since those files call
         registerDspAlgorithm() / registerRenderingAlgorithm() on load. -->
    <script src="{{ url_for('static', filename='shorts/core/dsp_registry.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/core/rendering_registry.js') }}"></script>

    <!-- Server-resolved: only the DSP algorithms this journey actually needs.
         Was hardcoded (all 3 filter files always, regardless of journey).
         Now: dsp_store.resolve(stages) in journey_bp.py returns only what's needed. -->
    {% for url in dsp_entrypoints %}
    <script src="{{ url }}"></script>
    {% endfor %}

    <!-- Server-resolved: only the renderers this journey actually needs. -->
    {% for url in rendering_entrypoints %}
    <script src="{{ url }}"></script>
    {% endfor %}

    <script src="{{ url_for('static', filename='shorts/core/dispatcher.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/core/journey_interpreter.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/core/journey_scroll_feed.js') }}"></script>

    <script>
        const journeyJson = {
            globalThemes: {{ journey_themes | tojson }},
            journeyRules: {{ journey_rules | tojson }},
            stages: {{ journey_stages | tojson }},
            uiShell: {{ journey_ui_shell | tojson }},
            playbackConfig: {{ journey_playback_config | tojson }},
            layout: {{ journey_layout | tojson }},
        };

        // If a different sample endpoint base was provided (e.g., for reels/fitness),
        // override the default before the feed starts fetching.
        {% if sample_endpoint_base %}
        globalSampleEndpointBase = "{{ sample_endpoint_base }}";
        {% endif %}

        applyCurrentTheme(); // must run before the feed starts -- buildChartLayout() and the glow filter both read CSS variables this sets, and would otherwise resolve to empty strings on the very first render

        // DEV TOOL -- only active when ?dev=1 is in the URL.
        // Cycles through fps/quality presets so you can find the sweet
        // spot without touching code. Remove this block (and the
        // _DEV_* globals in shared_signal_utils.js) when done tuning.
        if (new URLSearchParams(window.location.search).get('dev') === '1') {
            const PRESETS = [
                { label: "Native fps", throttle: 0,   points: 800  },
                { label: "60fps / HQ", throttle: 16,  points: 800  },
                { label: "30fps / HQ", throttle: 33,  points: 500  },
                { label: "30fps / MQ", throttle: 33,  points: 300  },
                { label: "20fps / MQ", throttle: 50,  points: 300  },
                { label: "15fps / LQ", throttle: 66,  points: 200  },
            ];
            let presetIndex = 0; // start at native -- Canvas can handle it

            function applyPreset(p) {
                globalThis._DEV_DRAW_THROTTLE_MS = p.throttle;
                globalThis._DEV_MAX_POINTS       = p.points;
                fpsBtn.textContent = `⚙ ${p.label}`;
            }

            const fpsBtn = document.createElement('button');
            fpsBtn.style.cssText = `
                position: fixed; top: 12px; left: 12px; z-index: 9999;
                background: rgba(0,0,0,0.75); color: #2dd4bf;
                border: 1px solid #2dd4bf55; border-radius: 20px;
                padding: 5px 12px; font-size: 0.72rem;
                font-family: 'IBM Plex Mono', monospace;
                cursor: pointer;
            `;
            applyPreset(PRESETS[presetIndex]);
            fpsBtn.addEventListener('click', () => {
                presetIndex = (presetIndex + 1) % PRESETS.length;
                applyPreset(PRESETS[presetIndex]);
            });
            document.body.appendChild(fpsBtn);

            // Canvas-specific controls -- glow and resolution.
            // These only affect chart_v1_canvas, ignored by Plotly renderer.
            const CANVAS_PRESETS = [
                { label: "Canvas: HQ",   glow: true,  dpr: devicePixelRatio },
                { label: "Canvas: MQ",   glow: false, dpr: devicePixelRatio },
                { label: "Canvas: LQ",   glow: false, dpr: 1                },
            ];
            let canvasPresetIndex = 0;

            function applyCanvasPreset(p) {
                globalThis._DEV_CANVAS_GLOW = p.glow;
                globalThis._DEV_CANVAS_DPR  = p.dpr;
                canvasBtn.textContent = `◈ ${p.label}`;
            }

            const canvasBtn = document.createElement('button');
            canvasBtn.style.cssText = `
                position: fixed; top: 46px; left: 12px; z-index: 9999;
                background: rgba(0,0,0,0.75); color: #d9a441;
                border: 1px solid #d9a44155; border-radius: 20px;
                padding: 5px 12px; font-size: 0.72rem;
                font-family: 'IBM Plex Mono', monospace;
                cursor: pointer;
            `;
            applyCanvasPreset(CANVAS_PRESETS[canvasPresetIndex]);
            canvasBtn.addEventListener('click', () => {
                canvasPresetIndex = (canvasPresetIndex + 1) % CANVAS_PRESETS.length;
                applyCanvasPreset(CANVAS_PRESETS[canvasPresetIndex]);
            });
            document.body.appendChild(canvasBtn);

            // ── Dev HUD ────────────────────────────────────────────────
            // Real-time rendering stats panel. Reads live values from
            // activeSweepControl, fetchedSignalCache, THEMES, RENDER_ALGORITHMS.
            // Updates every 200ms -- fast enough to feel live, not so fast
            // it itself becomes a performance concern.
            const hud = document.createElement('div');
            hud.style.cssText = `
                position: fixed;
                bottom: 0; left: 0; right: 0;
                z-index: 9999;
                background: rgba(0, 0, 0, 0.82);
                border-top: 1px solid rgba(45, 212, 191, 0.3);
                padding: 8px 14px 10px;
                font-family: 'IBM Plex Mono', monospace;
                font-size: 0.68rem;
                color: #747d8c;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 4px 16px;
                pointer-events: none;
            `;
            document.body.appendChild(hud);

            // Frame rate measurement -- tracks display frames, not rAF calls.
            // The naive approach of counting all rAF callbacks overcounts:
            // multiple simultaneous rAF loops (sweep, any Plotly internals)
            // each register their own callback, so 2 loops at 60fps = 240
            // counted "frames". The fix: track unique display frame timestamps.
            // The browser passes the same `now` value to ALL callbacks
            // scheduled for the same display frame, so we only count when
            // `now` changes from the last seen value.
            let lastSeenFrameTime = 0;
            let frameCount = 0;
            let lastFpsTime = performance.now();
            let measuredFps = 0;
            let lastRenderDuration = 0;
            let frameIntervalMs = 0;
            let prevDisplayFrame = performance.now();

            const _origRAF = window.requestAnimationFrame;
            window.requestAnimationFrame = function(cb) {
                return _origRAF.call(window, (now) => {
                    const renderStart = performance.now();
                    cb(now);
                    lastRenderDuration = performance.now() - renderStart;

                    // Only count this as a new display frame if the timestamp
                    // changed -- same `now` = same display frame, multiple loops
                    if (now !== lastSeenFrameTime) {
                        frameIntervalMs = now - prevDisplayFrame;
                        prevDisplayFrame = now;
                        lastSeenFrameTime = now;
                        frameCount++;
                    }
                });
            };

            function stat(label, value, color) {
                return `<span style="color:${color || '#9aa1ab'}">
                    <span style="color:#555">${label}: </span>${value}
                </span>`;
            }

            // Infer display Hz from actual rAF interval rather than
            // window.screen.refresh which is non-standard and only works
            // in Firefox -- Chrome on Android returns undefined.
            // The rAF interval IS the display frame period, so:
            // displayHz = round(1000 / frameIntervalMs) to nearest standard rate.
            function inferDisplayHz(intervalMs) {
                if (!intervalMs || intervalMs <= 0) return '?';
                const raw = 1000 / intervalMs;
                // Snap to nearest standard refresh rate
                const standards = [24, 30, 48, 60, 90, 120, 144, 165, 240];
                return standards.reduce((a, b) =>
                    Math.abs(b - raw) < Math.abs(a - raw) ? b : a
                );
            }

            function updateHud() {
                // FPS -- measured from actual rAF calls
                const now = performance.now();
                const elapsed = now - lastFpsTime;
                if (elapsed >= 500) {
                    measuredFps = Math.round((frameCount / elapsed) * 1000);
                    frameCount = 0;
                    lastFpsTime = now;
                }

                // Find the most recently active sweep -- the card with the
                // highest lastElapsedMs that's still running. This is the
                // card actually on screen, not the last card that called
                // runAndRender() (which could be a card that just scrolled
                // off or a preload).
                let sweepInfo = null;
                let activeSampleId = null;
                activeSweepControl.forEach((control, sid) => {
                    if (!sweepInfo || control.lastElapsedMs > sweepInfo.lastElapsedMs) {
                        sweepInfo = control;
                        activeSampleId = sid;
                    }
                });

                // Signal info from cache
                let signalInfo = null;
                if (sweepInfo) {
                    const cached = fetchedSignalCache.get(activeSampleId);
                    if (cached) signalInfo = cached;
                }

                // Samples traversed per second
                // = (total samples / total duration) * speed
                let samplesPerSec = '--';
                if (signalInfo && sweepInfo) {
                    const speed = GLOBAL_SPEED_OPTIONS[globalSpeedIndex];
                    const totalSamples = signalInfo.signal.length;
                    const totalDurSec = sweepInfo.totalDurationMs / 1000;
                    samplesPerSec = Math.round(totalSamples / totalDurSec * speed);
                }

                // Window samples (visible at any frame)
                const windowSamples = signalInfo
                    ? Math.round(3.0 * signalInfo.fs)
                    : '--';

                // Progress
                const progress = sweepInfo
                    ? Math.round((sweepInfo.lastElapsedMs / sweepInfo.totalDurationMs) * 100)
                    : 0;

                // Throttle setting
                const throttleMs = globalThis._DEV_DRAW_THROTTLE_MS ?? 33;
                const targetFps  = throttleMs === 0 ? 'native' : Math.round(1000 / throttleMs);

                // Registered renderers
                const renderers = Object.keys(RENDER_ALGORITHMS).join(', ') || 'none';

                // Theme
                const theme = THEMES[themeIndex]?.label || '--';

                // Active renderer -- best guess from registered algorithms
                // (we can't access per-card renderingEngine from global scope)
                const canvasActive = globalThis._DEV_CANVAS_GLOW !== undefined;

                hud.innerHTML = [
                    stat('display Hz',      `${inferDisplayHz(frameIntervalMs)}Hz`,    inferDisplayHz(frameIntervalMs) >= 90 ? '#2dd4bf' : '#9aa1ab'),
                    stat('card',           activeSampleId || '--', '#555'),
                    stat('stage',          globalThis._DEV_ACTIVE_STAGE !== undefined ? `[${globalThis._DEV_ACTIVE_STAGE}] ${journeyJson.stages[globalThis._DEV_ACTIVE_STAGE]?.stageId || ''}` : '--', '#555'),
                    stat('renderer',        globalThis._DEV_ACTIVE_RENDERER  || '--', '#e8f4f8'),
                    stat('algorithm',       globalThis._DEV_ACTIVE_ALGORITHM || '--', '#e8f4f8'),
                    stat('FPS measured',    `${measuredFps}`,                         measuredFps >= 100 ? '#2dd4bf' : measuredFps >= 55 ? '#2dd4bf' : measuredFps >= 30 ? '#d9a441' : '#ff4d4d'),
                    stat('frame interval',  `${frameIntervalMs.toFixed(2)}ms`,        frameIntervalMs <= 9 ? '#2dd4bf' : frameIntervalMs <= 17 ? '#9aa1ab' : '#ff4d4d'),
                    stat('FPS target',      `${targetFps}`),
                    stat('render cost',     `${lastRenderDuration.toFixed(2)}ms`,      lastRenderDuration < 5 ? '#2dd4bf' : lastRenderDuration < 12 ? '#d9a441' : '#ff4d4d'),
                    stat('samples/sec',     `${samplesPerSec}`),
                    stat('window samples',  `${windowSamples}`),
                    stat('total samples',   signalInfo ? signalInfo.signal.length : '--'),
                    stat('fs',              signalInfo ? `${signalInfo.fs}Hz` : '--'),
                    stat('progress',        sweepInfo ? `${progress}%` : '--'),
                    stat('elapsed',         sweepInfo ? `${(sweepInfo.lastElapsedMs/1000).toFixed(2)}s` : '--'),
                    stat('duration',        sweepInfo ? `${(sweepInfo.totalDurationMs/1000).toFixed(1)}s` : '--'),
                    stat('speed',           `${GLOBAL_SPEED_OPTIONS[globalSpeedIndex]}x`),
                    stat('theme',           theme),
                    stat('canvas glow',     canvasActive ? (globalThis._DEV_CANVAS_GLOW ? 'on' : 'off') : 'n/a'),
                    stat('canvas DPR',      canvasActive ? (globalThis._DEV_CANVAS_DPR ?? devicePixelRatio) : 'n/a'),
                    stat('renderers',       renderers,                                '#555'),
                    stat('max points',      globalThis._DEV_MAX_POINTS ?? 500),
                ].join('');
            }

            updateHud();
            setInterval(updateHud, 200);
        }

        startJourneyScrollFeed({
            apiEndpoint: "{{ journey_api_endpoint }}",
            journeyJson: journeyJson,
            feedContainer: document.getElementById("feed"),
        });
    </script>
</body>
</html>
