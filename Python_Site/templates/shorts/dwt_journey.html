<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DWT Journey (Experimental)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Reuses the REAL app's stylesheet directly -- .stage-bar, .segment,
         .stage-content, .chart-frame, .explain-step-btn are all defined
         there already. Genuine visual consistency, not a re-creation. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='shorts/shorts_feed.css') }}">
    <style>
        /* Demo-only page shell -- NOT part of shorts_feed.css, since this
           page isn't part of the main feed/pagination system at all. */
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
        }
        #dwt-card {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #dwt-viewport {
            position: relative;
            flex: 1;
        }
        /* Holds multiple SIMULTANEOUSLY-visible mini-charts (one per
           toggled-on decomposition level), stacked vertically and
           scrollable -- NOT a single chart. Comparing scale/shape across
           levels (e.g. is this baseline wander showing up in A5 but not
           D1?) genuinely needs several plots on screen at once, which a
           single-chart sweep view can't do. */
        .dwt-stack-container {
            position: absolute;
            inset: 0;
            bottom: 70px; /* leaves room for the toggle row below */
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dwt-stack-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
        }
        .dwt-stack-item-label {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 4px 8px 0;
        }
        .dwt-stack-item-chart {
            width: 100%;
            height: 140px;
        }
    </style>
</head>
<body>
    <div class="card" id="dwt-card">
        <div class="stage-bar" id="dwt-stage-bar">
            <div class="segment" data-stage="0"><div class="fill"></div></div>
            <div class="segment" data-stage="1"><div class="fill"></div></div>
        </div>

        <div class="stage-viewport" id="dwt-viewport">
            <div class="stage-content active" data-stage="0">
                <div class="stage-label">
                    Raw Signal
                    <span class="stage-label-small">Original ECG</span>
                </div>
                <div class="chart-frame" id="dwt-chart-0"></div>
            </div>

            <div class="stage-content" data-stage="1">
                <div class="stage-label">
                    Decomposition
                    <span class="stage-label-small">Discrete Wavelet Transform</span>
                </div>
                <div class="dwt-stack-container" id="dwt-chart-1"></div>
                <div class="explain-panel open" id="dwt-level-picker" style="position:absolute; bottom:0; left:0; right:0;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script src="{{ url_for('static', filename='shorts/core/rail_controls.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/core/shared_signal_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/filters/dwt_filter.js') }}"></script>
    <script src="{{ url_for('static', filename='shorts/dwt_demo/dwt_journey.js') }}"></script>
</body>
</html>
